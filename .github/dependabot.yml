version: 2
updates:
  # The updates of the build itself, which the versions plugin only prints in the log of a build
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: monthly
    # Only the majors wait here, the grouped one being merged as soon as its build passes
    open-pull-requests-limit: 10
    groups:
      # One pull request for everything compatible, a major update coming on its own, so that it lands as its
      # own commit and does not hold back the rest when its build fails
      dependencies:
        patterns: [ "*" ]
        update-types: [ minor, patch ]
    ignore:
      # The APIs the container provides, at the version the README says the library is built against: raising
      # their major changes what the library asks of a container, which is a decision rather than an update
      - dependency-name: "jakarta.ws.rs:jakarta.ws.rs-api"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "jakarta.annotation:jakarta.annotation-api"
        update-types: [ "version-update:semver-major" ]

  # The actions the workflows run on, whose major tag is what is pinned, so that only the next major shows up
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      # A single group, every update being a major one, so that the workflows move together as they did by hand
      actions:
        patterns: [ "*" ]
