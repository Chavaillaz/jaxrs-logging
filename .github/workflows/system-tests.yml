name: System tests
on:
  push:
    branches:
      - master
  pull_request:
    types: [ opened, synchronize, reopened ]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded run is dropped everywhere but on master, whose every push keeps its own status and badge
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/setup

      - name: Build project
        run: mvn -B -Pcoverage verify
